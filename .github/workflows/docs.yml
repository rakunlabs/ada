name: Docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.25.0
          runtime: node@24
          working-directory: _docs
          cache: true
          require-lockfile: true

      - name: Build docs and validate links
        run: pnpm run docs:build
        working-directory: _docs

      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/tags/docs'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: _docs/docs/.vitepress/dist
          include-hidden-files: true
          retention-days: 1

  release:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/tags/docs'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: _docs/docs/.vitepress/dist

      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_docs/docs/.vitepress/dist
